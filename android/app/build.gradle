plugins {
    id 'com.android.application'
}

// Redistributable files the game expects next to its disc image. The activity
// copies them to /sdcard/CTR/assets on start (game data itself is never bundled).
def ctrAssetsDir = layout.buildDirectory.dir('generated/ctrassets')
def syncCtrAssets = tasks.register('syncCtrAssets', Sync) {
    from('../../assets') {
        include 'dualshock.png'
        include 'fonts/FuzzyBubbles-Bold.ttf', 'fonts/FuzzyBubbles-OFL.txt'
        include 'fonts/LuckiestGuy-Regular.ttf', 'fonts/LuckiestGuy-Apache-2.0.txt', 'fonts/LuckiestGuy-NOTICE.txt'
        include 'fonts/README.md'
    }
    into ctrAssetsDir.map { it.dir('ctr') }
}
preBuild.dependsOn syncCtrAssets

android {
    namespace 'com.bilko.ctrvr'
    compileSdk 34
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId 'com.bilko.ctrvr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-29',
                          '-DCTR_NATIVE_64BIT=ON', '-DBUILD_TESTING=OFF'
                targets 'ctr_native'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../../externals/SDL/android-project/app/src/main/java']
            jniLibs.srcDirs = ['../third_party/openxr/lib']
            assets.srcDirs += [ctrAssetsDir.get().asFile.path]
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
